# DiscreteStack's low-latency tier, serving the host's non-reasoning variant: thinking
# is disabled server-side and callers cannot enable it, hence reasoning = false with no
# reasoning_options. Limits and modalities verified via https://setup.discretestack.com
# (accessed 2026-09-17). Underlying lab models rotate as newer open-weight releases are
# validated, so no fixed base model is claimed.
name = "DiscreteStack Stable Fast"
description = "DiscreteStack's lowest-latency tier for high-volume everyday coding without reasoning overhead"
release_date = "2026-05-01"
last_updated = "2026-09-17"
attachment = true
reasoning = false
temperature = true
tool_call = true
open_weights = true

[limit]
context = 1_000_000
output = 32_000

[modalities]
input = ["text", "image"]
output = ["text"]

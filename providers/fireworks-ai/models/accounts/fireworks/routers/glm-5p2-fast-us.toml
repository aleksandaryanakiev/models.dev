# US-only Serverless Fast router. Must be called via us.api.fireworks.ai (not
# the global api.fireworks.ai endpoint).
# Model ID + endpoint: https://docs.fireworks.ai/serverless/us-only-serverless
# GLM 5.2 Fast US is an explicit exception to the 1.5x US premium and matches
# global GLM 5.2 Fast: $2.10 / $0.21 / $6.60 (USD/MTok, input / cached input /
# output). https://docs.fireworks.ai/serverless/pricing (accessed 2026-09-17)
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = high|max
# https://docs.fireworks.ai/guides/reasoning
base_model = "zhipuai/glm-5.2"
name = "GLM 5.2 Fast US"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 2.1
output = 6.6
cache_read = 0.21

[limit]
context = 1_048_575
output = 131_072

[provider]
api = "https://us.api.fireworks.ai/inference/v1/"

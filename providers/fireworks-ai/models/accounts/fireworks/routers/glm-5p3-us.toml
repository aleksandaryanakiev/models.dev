# US-only Serverless router. Must be called via us.api.fireworks.ai (not the
# global api.fireworks.ai endpoint).
# Model ID + endpoint: https://docs.fireworks.ai/serverless/us-only-serverless
# Beginning 2026-09-01, US-only models are 1.5x base serverless prices.
# Base GLM 5.3 Standard: $1.40 / $0.26 / $4.40 → US $2.10 / $0.39 / $6.60
# (USD/MTok, input / cached input / output).
# https://docs.fireworks.ai/serverless/pricing (accessed 2026-09-17)
# Thinking-only on Fireworks (no toggle): reasoning_effort = low|high|max.
# Limits aligned with global fireworks glm-5p3 serving probes.
base_model = "zhipuai/glm-5.3"
name = "GLM 5.3 US"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 2.1
output = 6.6
cache_read = 0.39

[limit]
context = 1_048_573
output = 262_144

[provider]
api = "https://us.api.fireworks.ai/inference/v1/"

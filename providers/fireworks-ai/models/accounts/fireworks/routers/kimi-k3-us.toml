# US-only Serverless router. Must be called via us.api.fireworks.ai (not the
# global api.fireworks.ai endpoint).
# Model ID + endpoint: https://docs.fireworks.ai/serverless/us-only-serverless
# Standard + Priority pricing (USD/MTok, input / cached input / output):
# $4.50 / $0.45 / $22.50 and $5.625 / $0.5625 / $28.125
# https://docs.fireworks.ai/serverless/pricing (accessed 2026-09-17)
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|medium|high|max
# Budget: thinking.budget_tokens (N >= 1024; conflicts with reasoning_effort)
# https://docs.fireworks.ai/guides/reasoning
base_model = "moonshotai/kimi-k3"
name = "Kimi K3 US"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "max"]

[[reasoning_options]]
type = "budget_tokens"
min = 1_024

[cost]
input = 4.5
output = 22.5
cache_read = 0.45

[modalities]
input = ["text", "image"]

[provider]
api = "https://us.api.fireworks.ai/inference/v1/"

[experimental.modes.priority]
cost = { input = 5.625, output = 28.125, cache_read = 0.5625 }
provider = { body = { service_tier = "priority" } }
